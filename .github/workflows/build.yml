name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyautogui pynput pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "鼠小侠" mouse_recorder_pro.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 鼠小侠-exe
          path: dist/鼠小侠.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## 鼠小侠 - 轻量化键鼠录制回放工具

            **版本**: ${{ github.ref_name }}

            ### 功能特性
            - 高精度键鼠录制回放
            - 全局热键支持（F7-F12）
            - 脚本加密存储
            - 循环回放模式
            - 暂停/继续功能

            ### 使用说明
            下载附件 `鼠小侠.exe` 直接运行即可。
          files: |
            dist/鼠小侠.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
